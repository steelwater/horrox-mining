name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Tests, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  android:
    name: Android Debug APK
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install dependencies
        run: npm ci
      - name: Build playtest web assets
        run: npm run build:playtest
      - name: Sync Android assets and plugins
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Package APK with provenance
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/horrox-mining-debug.apk"
          cd "$RUNNER_TEMP/apk"
          sha256sum horrox-mining-debug.apk > SHA256SUMS
          printf 'commit=%s\nrun=%s/%s/actions/runs/%s\nvariant=debug\nweb_mode=playtest\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-info.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: horrox-mining-debug-${{ github.sha }}
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
